<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seance</title>
    <link rel="stylesheet" type="text/css" href="static/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/16327/MorphSVGPlugin3.min.js"></script>
    <script src=https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.8.4/socket.io.js"></script>
    <script src="static/client.js" defer type="module"></script>
</head>
<body>
    <div id="pastInfo">
        <div id="round1" class="round">
            <div class="question">
                <p class="questionText">Which <b>profession</b> handles me the most?</p>
                <div class="answers">
                    <div class="answer">
                        <p>Plumber</p>
                    </div>
                    <div class="answer">
                        <p>Cook</p>
                    </div>
                    <div class="answer">
                        <p>Teacher</p>
                    </div>
                    <div class="answer correct">
                        <p>Stock Broker</p>
                    </div>
                </div>
            </div>
            <div class="question">
                <p class="questionText">Which <b>genre</b> of entertainment do I play the biggest role in?</p>
                <div class="answers">
                    <div class="answer">
                        <p>Romance</p>
                    </div>
                    <div class="answer correct">
                        <p>Action</p>
                    </div>
                    <div class="answer">
                        <p>Horror</p>
                    </div>
                    <div class="answer">
                        <p>Sports</p>
                    </div>
                </div>
            </div>
        </div>
        <div id="round2" class="round">
            <div class="A/B-testing">
                <div class="scale" ranking="1"></div>
                <div class="options">
                    <p class="A closer">Chair</p>
                    <p class="B">Pumpkin</p>
                </div>
            </div>
            <div class="A/B-testing">
                <div class="scale" ranking="5"></div>
                <div class="options">
                    <p class="A">Table</p>
                    <p class="B closer">Helicopter</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
